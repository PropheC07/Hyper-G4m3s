<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Arena Component</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #lobby { background: #2a2a2a; padding: 25px; border-radius: 12px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, button { padding: 12px; font-size: 16px; border-radius: 6px; border: none; margin: 8px 0; width: 100%; box-sizing: border-box; }
        input { background: #3c3c3c; color: #fff; }
        button { background: #00ffcc; color: #111; font-weight: bold; cursor: pointer; }
        canvas { border: 4px solid #333; background: #111; display: none; }
    </style>
    <!-- Serverless WebSocket delivery network library -->
    <script src="https://ably.com"></script>
</head>
<body>

    <div id="lobby">
        <h2>🌐 Sync LAN Lobby</h2>
        <p>Type a matching Room Name with your friends on the network to play.</p>
        <input type="text" id="room-input" placeholder="Room Name (e.g., room1)..." value="lan-party">
        <button id="join-btn">Connect Instantly</button>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
// A public sandbox API key for development. Get your own free persistent key at ably.com
const ABLY_KEY = 'xVLy4A.s2Agdg:c8-P2WwR3yUo7J7Jc53J5M1J3Z2Q5M4O'; 

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const lobby = document.getElementById('lobby');

let ably, channel;
let myId = 'p_' + Math.random().toString(36).substr(2, 6);
let players = {};
let keys = {};
const SPEED = 5;

players[myId] = { x: Math.random() * 600 + 50, y: Math.random() * 400 + 50, color: `hsl(${Math.random() * 360}, 80%, 50%)` };

document.getElementById('join-btn').addEventListener('click', () => {
    const room = document.getElementById('room-input').value.trim().toLowerCase();
    if(!room) return;

    // Direct browser-to-browser data routing via Ably API
    ably = new Ably.Realtime({ key: ABLY_KEY, clientId: myId });
    channel = ably.channels.get(`lan-${room}`);

    channel.subscribe('update', (msg) => { players[msg.data.id] = msg.data.state; });
    channel.subscribe('leave', (msg) => { delete players[msg.data.id]; });

    // Broadcast our square to the lobby room
    channel.publish('update', { id: myId, state: players[myId] });

    lobby.style.display = 'none';
    canvas.style.display = 'block';

    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
    window.addEventListener('beforeunload', () => { channel.publish('leave', { id: myId }); });

    requestAnimationFrame(gameLoop);
});

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let moved = false;
    let me = players[myId];

    if (keys['w'] || keys['arrowup']) { me.y -= SPEED; moved = true; }
    if (keys['s'] || keys['arrowdown']) { me.y += SPEED; moved = true; }
    if (keys['a'] || keys['arrowleft']) { me.x -= SPEED; moved = true; }
    if (keys['d'] || keys['arrowright']) { me.x += SPEED; moved = true; }

    if (moved) {
        me.x = Math.max(0, Math.min(canvas.width - 30, me.x));
        me.y = Math.max(0, Math.min(canvas.height - 30, me.y));
        channel.publish('update', { id: myId, state: me });
    }

    Object.keys(players).forEach(id => {
        ctx.fillStyle = players[id].color;
        ctx.fillRect(players[id].x, players[id].y, 30, 30);
    });
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
