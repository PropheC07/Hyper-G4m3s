<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked LAN Games Portal</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
        h1 { color: #00ffcc; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 800px; margin: 40px auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 2px solid #333; text-decoration: none; color: #fff; transition: 0.2s; }
        .card:hover { border-color: #00ffcc; transform: translateY(-5px); }
    </style>
</head>
<body>
    <h1>🎮 My Unblocked Games Portal</h1>
    <p>Select a game below. Multiplayer games support instant LAN play!</p>
    
    <div class="grid">
        <!-- Link directly to your local multiplayer game subfolder -->
        <a href="lan-arena/index.html" class="card">
            <h3>🌐 LAN Square Arena</h3>
            <p>Real-time multiplayer square tag over Wi-Fi.</p>
        </a>
    </div>
</body>
</html>
