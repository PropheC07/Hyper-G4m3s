<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Games | Unblocked Hub</title>
    <meta name="description" content="The ultimate hub for clean, safe, and unblocked HTML5 games.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            scroll-behavior: smooth;
        }

        .game-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .hidden { display: none; }

        #game-overlay {
            background: rgba(0, 0, 0, 0.95);
        }

        #back-to-top {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 40;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="glass-nav sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl">V</div>
            <h1 class="text-2xl font-800 tracking-tighter">VAULT<span class="text-blue-500">GAMES</span></h1>
        </div>
        
        <div class="flex-1 max-w-md mx-6">
            <input type="text" id="search-bar" placeholder="Search games..." 
                class="w-full bg-slate-800 border border-slate-700 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-white">
        </div>

        <div class="hidden md:flex gap-6 text-sm font-semibold text-slate-400">
            <button onclick="filterCategory('All')" class="hover:text-white transition">All</button>
            <button onclick="filterCategory('Action')" class="hover:text-white transition">Action</button>
            <button onclick="filterCategory('Sports')" class="hover:text-white transition">Sports</button>
            <button onclick="filterCategory('Racing')" class="hover:text-white transition">Racing</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="container mx-auto px-6 py-12 text-center">
        <h2 class="text-4xl md:text-5xl font-extrabold mb-4">The Ultimate <span class="text-blue-500">Unblocked</span> Library</h2>
        <p class="text-slate-400 max-w-2xl mx-auto">Access the latest clean HTML5 games without restrictions. No downloads, just pure gameplay.</p>
    </header>

    <!-- Games Grid -->
    <main class="container mx-auto px-6 pb-20">
        <div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <!-- Game items will be injected here by JS -->
        </div>
    </main>

    <button id="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-lg transition">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-10 text-center text-slate-500 text-sm">
        <p>&copy; 2025 Vault Games Hub. Created for safe and educational gaming fun.</p>
    </footer>

    <!-- Fullscreen Game Overlay -->
    <div id="game-overlay" class="fixed inset-0 z-[100] hidden flex flex-col">
        <div class="flex items-center justify-between p-4 bg-slate-900 border-b border-slate-800">
            <h3 id="overlay-title" class="text-xl font-bold">Game Name</h3>
            <button id="close-overlay" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-bold transition">Exit Game</button>
        </div>
        <div class="flex-1 relative bg-black">
            <iframe id="game-frame" src="" class="w-full h-full border-none" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const games = [
            { id: 1, title: "Slope", category: "Action", thumb: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=400", url: "https://kdata1.com/2020/05/slope/" },
            { id: 2, title: "1v1.LOL", category: "Action", thumb: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400", url: "https://1v1.lol" },
            { id: 3, title: "Retro Bowl", category: "Sports", thumb: "https://images.unsplash.com/photo-1566577739112-5180d4bf9390?w=400", url: "https://game316024.konggames.com/gamez/0031/6024/live/index.html" },
            { id: 4, title: "Drift Hunters", category: "Racing", thumb: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=400", url: "https://www.stunt-cars.com/drift-hunters/" },
            { id: 5, title: "Tunnel Rush", category: "Action", thumb: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400", url: "https://tunnel-rush.io" },
            { id: 6, title: "BitLife", category: "Simulation", thumb: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=400", url: "https://bitlifeonline.com" },
            { id: 7, title: "Eggy Car", category: "Racing", thumb: "https://images.unsplash.com/photo-1532440596442-95447995b23c?w=400", url: "https://eggycar.org" },
            { id: 8, title: "Moto X3M", category: "Racing", thumb: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=400", url: "https://motox3m.org" },
            { id: 9, title: "Run 3", category: "Action", thumb: "https://images.unsplash.com/photo-1502139214982-d0ad34e7174e?w=400", url: "https://run3.io" },
            { id: 10, title: "Basketball Stars", category: "Sports", thumb: "https://images.unsplash.com/photo-1546519638-68e109498ffc?w=400", url: "https://basketball-stars.io" },
            { id: 11, title: "Shell Shockers", category: "Action", thumb: "https://images.unsplash.com/photo-1580234797602-22c37b2a6230?w=400", url: "https://shellshock.io" },
            { id: 12, title: "Paper.io 2", category: "Action", thumb: "https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?w=400", url: "https://paper-io.com" },
            { id: 13, title: "Friday Night Funkin", category: "Music", thumb: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400", url: "https://ninja-muffin24.itch.io/funkin" },
            { id: 14, title: "Among Us", category: "Action", thumb: "https://images.unsplash.com/photo-1605898399742-8c17377f078d?w=400", url: "https://among-us.io" },
            { id: 15, title: "Cookie Clicker", category: "Idle", thumb: "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=400", url: "https://orteil.dashnet.org/cookieclicker/" }
        ];

        const grid = document.getElementById('games-grid');
        const searchInput = document.getElementById('search-bar');
        const overlay = document.getElementById('game-overlay');
        const gameFrame = document.getElementById('game-frame');
        const overlayTitle = document.getElementById('overlay-title');
        const closeBtn = document.getElementById('close-overlay');
        const bttBtn = document.getElementById('back-to-top');

        let currentCategory = "All";

        function renderGames(filterText = "") {
            grid.innerHTML = "";
            const filtered = games.filter(g => {
                const matchesSearch = g.title.toLowerCase().includes(filterText.toLowerCase());
                const matchesCategory = currentCategory === "All" || g.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            
            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = "game-card bg-slate-800 rounded-xl overflow-hidden cursor-pointer flex flex-col group";
                card.innerHTML = `
                    <div class="relative aspect-square overflow-hidden bg-slate-700">
                        <img src="${game.thumb}" alt="${game.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" loading="lazy">
                        <div class="absolute inset-0 bg-blue-600/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                             <span class="bg-blue-600 text-white px-4 py-2 rounded-full font-bold transform translate-y-4 group-hover:translate-y-0 transition-transform">Play Now</span>
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="font-bold text-sm truncate">${game.title}</h4>
                        <span class="text-xs text-slate-500">${game.category}</span>
                    </div>
                `;
                card.onclick = () => openGame(game);
                grid.appendChild(card);
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">No games found.</p>`;
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderGames(searchInput.value);
        }

        searchInput.oninput = (e) => renderGames(e.target.value);

        function openGame(game) {
            overlayTitle.innerText = game.title;
            gameFrame.src = game.url;
            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        closeBtn.onclick = () => {
            overlay.classList.add('hidden');
            gameFrame.src = "";
            document.body.style.overflow = 'auto';
        };

        window.onscroll = () => {
            if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
                bttBtn.style.display = "block";
            } else {
                bttBtn.style.display = "none";
            }
        };

        renderGames();
    </script>
</body>
</html>
