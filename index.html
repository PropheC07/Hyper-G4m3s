<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper G4m3 | Unblocked Gaming</title>
    <meta name="description" content="The ultimate hub for clean, safe, and unblocked HTML5 games.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap');
        
        :root {
            --hyper-blue: #00a2ff;
            --hyper-silver: #e2e8f0;
            --hyper-dark: #020617;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--hyper-dark);
            color: var(--hyper-silver);
            scroll-behavior: smooth;
        }

        h1, h2, h3, .logo-text {
            font-family: 'Orbitron', sans-serif;
        }

        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--hyper-blue);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.3);
        }

        .glass-nav {
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid var(--hyper-blue);
        }

        .hyper-gradient-text {
            background: linear-gradient(to right, #fff, var(--hyper-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(var(--hyper-blue), #3b82f6); 
            border-radius: 5px; 
        }

        .hidden { display: none !important; }

        #game-overlay {
            background: rgba(2, 6, 23, 0.98);
        }

        .category-btn {
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .category-btn.active {
            background: var(--hyper-blue);
            color: white;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.5);
        }

        @keyframes pulse-border {
            0% { border-color: rgba(0, 162, 255, 0.5); }
            50% { border-color: rgba(0, 162, 255, 1); }
            100% { border-color: rgba(0, 162, 255, 0.5); }
        }

        .playing-border {
            animation: pulse-border 2s infinite;
            border-bottom: 3px solid var(--hyper-blue);
        }

        .pause-menu {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--hyper-blue);
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="glass-nav sticky top-0 z-50 px-6 py-3 flex flex-wrap items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer logo-container" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <div class="relative w-12 h-12 flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="absolute inset-0 w-full h-full">
                    <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="#00a2ff" stroke-width="4"/>
                </svg>
                <span class="text-white font-black text-xl logo-text">HG</span>
            </div>
            <h1 class="text-2xl font-900 tracking-tighter">HYPER<span class="text-blue-500">G4M3</span></h1>
        </div>
        
        <div class="flex-1 max-w-lg mx-6 order-3 md:order-2 w-full mt-4 md:mt-0">
            <div class="relative">
                <input type="text" id="search-bar" placeholder="Find your game..." 
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-12 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-white placeholder-slate-500">
                <svg class="absolute left-4 top-3.5 text-slate-500" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
        </div>

        <div class="hidden lg:flex gap-4 order-2 md:order-3">
            <button onclick="filterCategory('All')" class="category-btn active px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800">ALL</button>
            <button onclick="filterCategory('Action')" class="category-btn px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800 hover:bg-slate-700">ACTION</button>
            <button onclick="filterCategory('Sports')" class="category-btn px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800 hover:bg-slate-700">SPORTS</button>
            <button onclick="filterCategory('Casual')" class="category-btn px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800 hover:bg-slate-700">CASUAL</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="container mx-auto px-6 py-16 text-center">
        <div class="inline-block px-4 py-1 rounded-full border border-blue-500/30 bg-blue-500/10 text-blue-400 text-xs font-bold mb-6 tracking-widest uppercase">
            Hyper Performance Gaming
        </div>
        <h2 class="text-5xl md:text-7xl font-900 mb-6 hyper-gradient-text">UNBLOCK THE <br>EXPERIENCE</h2>
        <p class="text-slate-400 max-w-2xl mx-auto text-lg">The premium destination for unblocked favorites. High speed, no ads, just gaming.</p>
    </header>

    <!-- Games Grid -->
    <main class="container mx-auto px-6 pb-24">
        <div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <!-- Injected by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-black/30 py-12 px-6">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-3">
                <span class="text-xl font-900 tracking-tighter logo-text">HYPER<span class="text-blue-500">G4M3</span></span>
            </div>
            <p class="text-slate-500 text-sm">© 2025 Hyper G4m3 Hub. Powered by High-Speed Servers.</p>
            <div class="flex gap-4">
                <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center hover:bg-blue-600 cursor-pointer transition">G+</div>
                <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center hover:bg-blue-600 cursor-pointer transition">CC</div>
            </div>
        </div>
    </footer>

    <!-- Fullscreen Game Overlay -->
    <div id="game-overlay" class="fixed inset-0 z-[100] hidden flex flex-col">
        <div class="flex items-center justify-between p-4 glass-nav playing-border">
            <div class="flex items-center gap-3">
                 <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-bold text-xs logo-text">HG</div>
                 <h3 id="overlay-title" class="text-lg font-bold uppercase tracking-wider">Game Title</h3>
            </div>
            <div class="flex gap-3">
                <button onclick="togglePauseMenu()" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg transition" title="Pause Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>
                <button onclick="toggleFullscreen()" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg transition" title="Fullscreen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 3 6 6M9 21l-6-6M21 3l-6 6M3 21l6-6"/></svg>
                </button>
                <button id="close-overlay" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold transition shadow-lg shadow-red-900/20">EXIT</button>
            </div>
        </div>
        <div class="flex-1 relative bg-black flex items-center justify-center">
            <!-- Loading Spinner -->
            <div id="loading-spinner" class="absolute text-blue-500 animate-spin z-0">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10" opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
            </div>
            
            <!-- Pause Menu Overlay -->
            <div id="pause-menu" class="hidden absolute inset-0 z-20 flex items-center justify-center pause-menu">
                <div class="text-center p-8 rounded-3xl border border-blue-500/50 bg-slate-900 shadow-2xl max-w-sm w-full mx-4">
                    <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-blue-500/40">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </div>
                    <h3 class="text-3xl font-black logo-text mb-2 uppercase tracking-tighter">Paused</h3>
                    <p class="text-slate-400 text-sm mb-8">Game is currently held. Ready to resume?</p>
                    <div class="flex flex-col gap-3">
                        <button onclick="togglePauseMenu()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition uppercase tracking-widest text-sm">Resume Game</button>
                        <button onclick="reloadGame()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition uppercase tracking-widest text-sm text-slate-300">Restart Session</button>
                        <button onclick="closeGame()" class="w-full py-3 bg-red-600/20 hover:bg-red-600/40 text-red-500 rounded-xl font-bold transition uppercase tracking-widest text-sm mt-4">Quit to Menu</button>
                    </div>
                </div>
            </div>

            <iframe id="game-frame" src="" class="w-full h-full border-none z-10" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const games = [
            { id: 1, title: "Slope", category: "Action", thumb: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=400", url: "https://kdata1.com/2020/05/slope/" },
            { id: 2, title: "1v1.LOL", category: "Action", thumb: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400", url: "https://1v1.lol" },
            { id: 3, title: "Retro Bowl", category: "Sports", thumb: "https://images.unsplash.com/photo-1566577739112-5180d4bf9390?w=400", url: "https://game316024.konggames.com/gamez/0031/6024/live/index.html" },
            { id: 4, title: "Drift Hunters", category: "Racing", thumb: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=400", url: "https://www.stunt-cars.com/drift-hunters/" },
            { id: 5, title: "Tunnel Rush", category: "Action", thumb: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400", url: "https://tunnel-rush.io" },
            { id: 6, title: "BitLife", category: "Casual", thumb: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=400", url: "https://bitlifeonline.com" },
            { id: 7, title: "Eggy Car", category: "Racing", thumb: "https://images.unsplash.com/photo-1532440596442-95447995b23c?w=400", url: "https://eggycar.org" },
            { id: 8, title: "Moto X3M", category: "Racing", thumb: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=400", url: "https://motox3m.org" },
            { id: 9, title: "Run 3", category: "Action", thumb: "https://images.unsplash.com/photo-1502139214982-d0ad34e7174e?w=400", url: "https://run3.io" },
            { id: 10, title: "Basketball Stars", category: "Sports", thumb: "https://images.unsplash.com/photo-1546519638-68e109498ffc?w=400", url: "https://basketball-stars.io" },
            { id: 11, title: "Shell Shockers", category: "Action", thumb: "https://images.unsplash.com/photo-1580234797602-22c37b2a6230?w=400", url: "https://shellshock.io" },
            { id: 12, title: "Paper.io 2", category: "Action", thumb: "https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?w=400", url: "https://paper-io.com" },
            { id: 13, title: "Friday Night Funkin", category: "Casual", thumb: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400", url: "https://ninja-muffin24.itch.io/funkin" },
            { id: 14, title: "Among Us", category: "Action", thumb: "https://images.unsplash.com/photo-1605898399742-8c17377f078d?w=400", url: "https://among-us.io" },
            { id: 15, title: "Cookie Clicker", category: "Casual", thumb: "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=400", url: "https://orteil.dashnet.org/cookieclicker/" },
            { id: 16, title: "Tetris", category: "Casual", thumb: "https://images.unsplash.com/photo-1585338111222-d182f01905fe?w=400", url: "https://tetris.com/play-tetris" },
            { id: 17, title: "Smash Karts", category: "Action", thumb: "https://images.unsplash.com/photo-1593305841991-05c297ba4575?w=400", url: "https://smashkarts.io" },
            { id: 18, title: "Geometry Dash", category: "Action", thumb: "https://images.unsplash.com/photo-1614027126733-727653f51b9b?w=400", url: "https://geometrydash.io" },
            { id: 19, title: "Subway Surfers", category: "Action", thumb: "https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=400", url: "https://subwaysurfers.com" },
            { id: 20, title: "Basket Random", category: "Sports", thumb: "https://images.unsplash.com/photo-1519861531473-9200362f46b3?w=400", url: "https://basketrandom.com" },
            { id: 21, title: "Bad Ice Cream", category: "Action", thumb: "https://images.unsplash.com/photo-1501443762994-82bd5dace89a?w=400", url: "https://classroom6x.gitlab.io/bad-ice-cream/" },
            { id: 22, title: "Bad Ice Cream 2", category: "Action", thumb: "https://images.unsplash.com/photo-1534706936160-d5ee67737049?w=400", url: "https://classroom6x.gitlab.io/bad-ice-cream-2/" },
            { id: 23, title: "Bad Ice Cream 3", category: "Action", thumb: "https://images.unsplash.com/photo-1516559828984-fb3b99548b21?w=400", url: "https://classroom6x.gitlab.io/bad-ice-cream-3/" },
            { id: 24, title: "Backrooms 2D", category: "Casual", thumb: "https://images.unsplash.com/photo-1505673542670-a5e3ff5b14a3?w=400", url: "https://classroom6x.gitlab.io/backrooms-2d/" },
            { id: 25, title: "Monkey Mart", category: "Casual", thumb: "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=400", url: "https://monkeymart.io" }
        ];

        const grid = document.getElementById('games-grid');
        const searchInput = document.getElementById('search-bar');
        const overlay = document.getElementById('game-overlay');
        const gameFrame = document.getElementById('game-frame');
        const overlayTitle = document.getElementById('overlay-title');
        const closeBtn = document.getElementById('close-overlay');
        const loader = document.getElementById('loading-spinner');
        const pauseMenu = document.getElementById('pause-menu');

        let currentCategory = "All";
        let currentGameUrl = "";

        function renderGames(filterText = "") {
            grid.innerHTML = "";
            const filtered = games.filter(g => {
                const matchesSearch = g.title.toLowerCase().includes(filterText.toLowerCase());
                const matchesCategory = currentCategory === "All" || g.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            
            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = "game-card bg-slate-900/40 rounded-2xl overflow-hidden cursor-pointer flex flex-col group backdrop-blur-sm";
                card.innerHTML = `
                    <div class="relative aspect-video overflow-hidden bg-slate-800">
                        <img src="${game.thumb}" alt="${game.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy">
                        <div class="absolute inset-0 bg-blue-600/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                             <div class="bg-white text-blue-600 px-6 py-2 rounded-full font-black text-xs tracking-widest transform translate-y-4 group-hover:translate-y-0 transition-transform shadow-xl uppercase">Play</div>
                        </div>
                    </div>
                    <div class="p-4 border-t border-slate-800/50">
                        <h4 class="font-bold text-sm truncate uppercase tracking-tight group-hover:text-blue-400 transition-colors">${game.title}</h4>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">${game.category}</span>
                            <div class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_5px_rgba(34,197,94,1)]"></div>
                        </div>
                    </div>
                `;
                card.onclick = () => openGame(game);
                grid.appendChild(card);
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500 font-bold uppercase tracking-widest">No signals found. Try another search.</div>`;
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.innerText.toLowerCase() === cat.toLowerCase()) {
                    btn.classList.add('active', 'bg-blue-600');
                    btn.classList.remove('bg-slate-800');
                } else {
                    btn.classList.remove('active', 'bg-blue-600');
                    btn.classList.add('bg-slate-800');
                }
            });
            renderGames(searchInput.value);
        }

        searchInput.oninput = (e) => renderGames(e.target.value);

        function openGame(game) {
            overlayTitle.innerText = game.title;
            loader.classList.remove('hidden');
            pauseMenu.classList.add('hidden');
            currentGameUrl = game.url;
            gameFrame.src = game.url;
            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            gameFrame.onload = () => {
                loader.classList.add('hidden');
            };
        }

        function togglePauseMenu() {
            pauseMenu.classList.toggle('hidden');
            // This acts as a "Privacy Shield" or "Boss Key" by covering the game iframe
        }

        function reloadGame() {
            loader.classList.remove('hidden');
            gameFrame.src = currentGameUrl;
            pauseMenu.classList.add('hidden');
        }

        function closeGame() {
            overlay.classList.add('hidden');
            gameFrame.src = "";
            pauseMenu.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        closeBtn.onclick = closeGame;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                gameFrame.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        renderGames();
    </script>
</body>
</html>
